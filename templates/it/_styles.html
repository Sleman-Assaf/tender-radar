{# templates/it/_styles.html — shared styles for the System Dashboard #}
<style>
  /* Sub-navigation: the System Dashboard is the single entry point, so every
     administrative module is reached from this strip. */
  /* Both module strips are centred on the page. justify-content rather than
     margin:auto so the items stay centred as a group while each keeps its own
     width, and wrapping still works on a narrow window. */
  /* Sized up from .78rem/11px: these are the primary way into every
     administrative module, and at the old size they read as fine print next to
     the main site navigation above them. */
  .itnav{display:flex;justify-content:center;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--line);margin-bottom:26px}
  .itnav a{display:inline-flex;align-items:center;gap:9px;padding:16px 22px;font-size:1rem;
           font-weight:600;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;
           transition:.14s;white-space:nowrap}
  .itnav a:hover{color:var(--ink);background:var(--paper)}
  .itnav a.active{color:var(--ink);font-weight:700;border-bottom-color:var(--yellow)}
  /* Second strip: the modules that used to sit in the main "System" dropdown.
     Visually subordinate to the account-administration row above it, but the
     same control, so it behaves identically. */
  .itnav-2{margin-top:-26px;border-bottom:1px solid var(--line);background:var(--paper)}
  .itnav-2 a{font-size:.92rem;padding:13px 19px}
  .itnav a .icon{width:20px;height:20px;opacity:.75}
  .itnav-2 a .icon{width:18px;height:18px}
  .itnav a.active .icon{opacity:1}

  /* Documentation menu in the page header — opens on hover, and on click so it
     also works with a touch screen or the keyboard. The panel is anchored with
     top:100% and carries its own top padding, so moving the pointer from the
     button onto the panel never crosses a gap that would close it. */
  .doc-menu{position:relative;display:inline-block}
  .doc-menu-panel{display:none;position:absolute;top:100%;right:0;z-index:200;
    padding-top:6px;min-width:290px}
  .doc-menu:hover .doc-menu-panel,
  .doc-menu.open .doc-menu-panel{display:block}
  .doc-menu-panel > a{display:block;background:var(--paper-2);
    border:1px solid var(--line-2);border-bottom:none;padding:10px 13px;
    font-size:.79rem;font-weight:700;color:var(--ink-2);transition:.12s}
  .doc-menu-panel > a:last-child{border-bottom:1px solid var(--line-2);
    box-shadow:var(--shadow-lg)}
  .doc-menu-panel > a:hover{background:var(--paper);color:var(--ink);
    box-shadow:inset 3px 0 0 var(--yellow)}
  .doc-menu-panel > a span{display:block;font-weight:400;font-size:.71rem;
    color:var(--muted);margin-top:3px;letter-spacing:0;text-transform:none}

  /* Stat tiles */
  .it-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:26px}
  .it-stat{background:var(--paper-2);border:1px solid var(--line);border-top:3px solid var(--yellow);padding:16px 17px}
  .it-stat.ok{border-top-color:var(--ok)}
  .it-stat.warn{border-top-color:var(--warn)}
  .it-stat.bad{border-top-color:var(--bad)}
  .it-stat .lbl{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .it-stat .val{font-size:2.1rem;font-weight:700;letter-spacing:-.03em;line-height:1;margin:9px 0 4px;
                font-variant-numeric:tabular-nums}
  .it-stat .sub{font-size:.74rem;color:var(--muted)}

  /* Card grid (quick actions, settings) */
  .it-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .it-card{display:flex;flex-direction:column;background:var(--paper-2);border:1px solid var(--line);
           border-top:3px solid var(--line-2);padding:20px;text-decoration:none;color:var(--ink);
           transition:border-color .15s,transform .12s,box-shadow .12s}
  .it-card:hover{border-top-color:var(--yellow);transform:translateY(-2px);box-shadow:var(--shadow)}
  .it-card .ic{width:42px;height:42px;display:flex;align-items:center;justify-content:center;
               background:var(--ink);color:var(--yellow);margin-bottom:13px}
  .it-card .t{font-weight:700;font-size:.95rem;letter-spacing:-.01em;margin-bottom:5px}
  .it-card .d{font-size:.8rem;color:var(--muted);line-height:1.55;flex:1}
  .it-card .m{display:flex;gap:15px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
              font-size:.74rem;color:var(--muted)}
  .it-card .m b{font-size:1.2rem;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}

  /* Two-column layout for dashboard panels */
  .it-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px;margin-top:8px}

  /* Role pills */
  .role-pill{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;
             letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;white-space:nowrap;
             border:1px solid var(--line-2);color:var(--muted)}
  .role-pill.SUPER_ADMIN{background:var(--ink);color:var(--yellow);border-color:var(--ink)}
  .role-pill.IT{background:var(--paper-3);color:var(--ink);border-color:var(--yellow)}
  .role-pill.USER{background:transparent;color:var(--muted);border-color:var(--line-2)}

  .state-pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;
              text-transform:uppercase;letter-spacing:.05em;padding:3px 9px;border:1px solid}
  .state-pill.on{color:var(--ok);border-color:var(--ok);background:transparent}
  .state-pill.off{color:var(--muted);border-color:var(--line-2)}
  .state-pill.err{color:var(--bad);border-color:var(--bad);background:var(--bad-bg)}
  .state-pill.warn{color:var(--warn);border-color:var(--warn)}

  /* Filter bar */
  .it-filters{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:16px}
  .it-filters select,.it-filters input[type=search],.it-filters input[type=text]{
      background:var(--paper-2);border:1px solid var(--line-2);color:var(--ink);
      padding:8px 11px;font-size:.8rem;font-family:var(--font);outline:none}
  .it-filters select:focus,.it-filters input:focus{border-color:var(--ink);box-shadow:inset 0 -2px 0 var(--yellow)}
  .it-seg{display:inline-flex;border:1px solid var(--line-2)}
  .it-seg a{padding:8px 13px;font-size:.76rem;font-weight:700;color:var(--muted);text-decoration:none;
            border-right:1px solid var(--line-2)}
  .it-seg a:last-child{border-right:none}
  .it-seg a.active{background:var(--ink);color:#fff}

  /* Inline list rows (dashboard panels) */
  .it-list{display:flex;flex-direction:column}
  .it-row{display:flex;align-items:center;gap:11px;padding:10px 16px;border-bottom:1px solid var(--line);
          font-size:.82rem}
  .it-row:last-child{border-bottom:none}
  .it-row .grow{flex:1;min-width:0}
  .it-row .nm{font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .it-row .sm{font-size:.72rem;color:var(--muted)}
  .it-row .num{font-weight:700;font-variant-numeric:tabular-nums}
  .it-empty{padding:28px 18px;text-align:center;color:var(--muted-2);font-size:.82rem}

  /* Bar meter for "users per department" */
  .it-bar{height:6px;background:var(--line);flex:1;min-width:60px;overflow:hidden}
  .it-bar span{display:block;height:100%;background:var(--yellow)}

  /* Danger zone panel */
  .it-danger{border:1px solid var(--bad);background:var(--bad-bg);padding:16px 18px;margin-top:20px}
  .it-danger h3{font-size:.76rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;
                color:var(--bad);margin-bottom:7px}
  .it-danger p{font-size:.82rem;color:var(--ink-2);line-height:1.6;margin-bottom:12px}

  .it-note{font-size:.79rem;color:var(--muted);line-height:1.6;background:var(--paper);
           border-left:3px solid var(--line-2);padding:11px 14px;margin-bottom:18px}

  /* Between the phone breakpoint and a full-width desktop the first strip has
     seven items. Trimming the horizontal padding keeps them on one line at the
     larger type size, rather than spilling onto a second row. */
  @media(max-width:1150px){
    .itnav a{padding-left:10px;padding-right:10px;gap:7px}
    .itnav-2 a{padding-left:9px;padding-right:9px;gap:7px}
  }
  @media(max-width:760px){
    .itnav{overflow-x:auto;flex-wrap:nowrap}
    .it-stat .val{font-size:1.7rem}
  }
</style>
